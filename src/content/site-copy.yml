# ─────────────────────────────────────────────────────────────────────
#  EVERY WORD ON JULIABERCHTOLD.COM
#
#  How to edit:
#   1. Click the pencil icon (top right on GitHub).
#   2. Change the words AFTER the colons. Leave the labels before the
#      colons alone (homepage:, title:, blurb: …) — the site uses them
#      to find your text.
#   3. Click "Commit changes". The site updates itself in about a minute.
#
#  A few rules that keep things working:
#   • Keep the indentation (the spaces at the start of each line) as it is.
#   • Longer paragraphs sit under a  >  on their own indented lines.
#     Write freely there: apostrophes, quotes, colons, anything.
#   • Short one-line text is wrapped in "double quotes". If you want a
#     double quote inside one, use curly quotes “like this” instead.
#   • Lines starting with # are notes to you; the site ignores them.
#
#  If something breaks, the site simply keeps showing the last good
#  version, and the Actions tab on GitHub shows a red ✗. Undo your last
#  change (or ask Claude) and it will go green again.
#
#  The Rome guide lives in its own file: src/content/rome.md
# ─────────────────────────────────────────────────────────────────────


# ═══ EVERY PAGE ═════════════════════════════════════════════════════
site:
  # What Google and link previews show when a page has no description of its own
  description: "Julia Berchtold — photographs, travel, and handmade jewelry. I capture experiences, and I create them."


# ═══ HOMEPAGE ═══════════════════════════════════════════════════════
homepage:
  description: "Julia Berchtold — I notice, I explore, I make. Photographs for friends and friends of friends, a Rome guide, and one-of-a-kind jewelry."

  # The Polaroid tied to the Rome pin
  polaroid_big: "Rome"
  polaroid_small: "my guide →"

  # The three descriptions below the big panels
  notice:
    label: "Photography"
    heading: "The moments I capture"
    text: >
      Weddings, new babies, people and community gatherings, for friends
      and friends of friends. I'm usually the one getting the room to
      laugh, which is when the real moments happen.
    link_1: "See my photographs →"
    link_2: "Ask about a shoot"
  explore:
    label: "Travel"
    heading: "The places I wander"
    text: >
      Eighteen of Italy's twenty regions and counting, the Rome guide I
      keep for friends, and the places farther afield that changed how I
      see the world.
    link_1: "Open the map →"
    link_2: "The Rome guide"
  make:
    label: "Studio"
    heading: "The things I make"
    text: >
      Jewelry that makes a statement, for a good cause. A portion of every
      sale goes to a new charitable organization each month. Some pieces
      are ready now; others I'll make with you.
    link_1: "Visit juju.bee studio →"

  # The About strip at the bottom of the homepage
  about:
    heading: "Hi, I'm Julia."
    text: >
      I'm Julia (or "Juju"), an amateur photographer, designer, maker, and
      collector of moments, stories, and way too many hobbies. I'm
      endlessly fascinated by people, the places that shape us, and the
      beauty hiding in plain sight. This little space is where all my
      curiosities come together.
    button: "More about me →"


# ═══ PHOTOGRAPHY ════════════════════════════════════════════════════
photography:
  description: "Weddings, family, people, community and travel — photographs by Julia Berchtold, for friends and friends of friends."
  hint: "Drag or scroll to look around"

  # One block per gallery. For each:
  #   title       the gallery name
  #   word        the handwritten word on the gallery page
  #   link        the link text that appears under photos on the landing page
  #   blurb       the intro paragraph on the gallery page
  #   story_title / story_meta   the heading and small caps line of its story
  galleries:
    weddings:
      title: "Weddings"
      word: "love"
      link: "All weddings"
      blurb: >
        Weddings and engagements. Vows, toasts, and everything in between.
        I'm the friend with the camera who gets the whole room laughing,
        which is when the real moments happen.
      story_title: "Confetti on the steps"
      story_meta: "Wedding"
    family:
      title: "Family"
      word: "new life"
      link: "All family"
      blurb: >
        First weeks home, big sisters, and the dog who won't leave the
        baby's side. I come to you, follow the family's rhythm, and
        photograph what's already there.
      story_title: "First weeks home"
      story_meta: "Newborn session"
    people:
      title: "People"
      word: "who you are"
      link: "All people"
      blurb: >
        My favorite subject. Candids, portraits and headshots of friends,
        family, and people I meet along the way. By the end, you've
        forgotten the camera is there.
      story_title: "People I notice"
      story_meta: "Candids, portraits and headshots"
    community:
      title: "Community"
      word: "change-makers"
      link: "All community"
      blurb: >
        Galas, fundraisers and gatherings for causes I care about. I move
        through the room so the photos feel like being there.
      story_title: "A night for a cause"
      story_meta: "Charity gala"
    travel:
      title: "Travel"
      word: "the world"
      link: "All travel"
      blurb: >
        The places that shape us, and the beauty hiding in plain sight
        along the way.
      story_title: "Places that shaped me"
      story_meta: "Travel"

  # Bottom of every story page
  story_cta: "Want photos like these? Tell me who'll be there."
  story_button: "Ask about a shoot"


# ═══ TRAVEL ═════════════════════════════════════════════════════════
travel:
  description: "Eighteen of Italy's twenty regions and counting, and the Rome guide Julia keeps for friends."
  heading: "The places I wander"
  intro: >
    Eighteen of Italy's twenty regions and counting, the Rome guide I keep
    for friends, and the places farther afield that changed how I see the
