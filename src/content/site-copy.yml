# ═══ STUDIO ═════════════════════════════════════════════════════════
studio:
  description: "juju.bee studio: handmade earrings and commissions, each paired with an original watercolor. A portion of every sale goes to a charity that changes monthly."
  heading: "juju.bee studio"
  intro: >
    Jewelry that makes a statement, for a good cause. Every pair comes
    with an original watercolor of mine, and a portion of every sale goes
    to a new charitable organization each month.
  cause_label: "This month's cause"
  cause_text: "Announced on"   # followed by the @juju.bee.studio link

  collection_heading: "The collection"
  collection_note: "Made by hand, a few at a time. Each pair comes with an original watercolor."
  ask_link: "Ask about a pair →"

  # The designs, in order. To change a photo, swap the file name
  # (photos live in public/img/j/). Leave tag empty ("") for no label.
  designs:
    - photo: "j/oysters.jpg"
      name: "Oysters"
      note: "Layered oyster shells with a freshwater pearl. In black or white; you choose the pearl color."
      tag: "Most loved"
    - photo: "j/face-lips.jpg"
      name: "Face & lips"
      note: "Two line-drawn faces, eye to eye, each with a red lip."
      tag: ""
    - photo: "j/sacred-feminine.jpg"
      name: "Sacred feminine"
      note: "An abstract figure with onyx, a pair of pearls and a garnet-red drop."
      tag: ""
    - photo: "j/pearl-earring.jpg"
      name: "Girl with a Pearl Earring"
      note: "A single-line portrait wearing her own freshwater pearl."
      tag: ""

  commissions_label: "Commissions"
  commissions_heading: "Something made for you"
  commissions_intro: >
    For a wedding, a gift, a big moment. Tell me who it's for and what they
    love, and I'll sketch a few ideas, then paint a watercolor to go with
    the finished piece. A few I've made:
  commissions:
    - photo: "j/custom-paraclimbing.jpg"
      title: "For the Paraclimbing World Cup"
      story: "Climbing knots in neon green with blue drops, for a friend competing in Korea and Japan."
    - photo: "j/custom-paso-robles.jpg"
      title: "A wine-country wedding"
      story: "Earrings and a branch pin for a friend's wedding in Paso Robles."
    - photo: "j/custom-wedding-pin.jpg"
      title: "A pin for my new sister"
      story: "For my brother's wife on their wedding day: a gold branch hung with a grey pearl, mother-of-pearl, a hummingbird and a 1994 Italian 20-lire coin."


# ═══ ABOUT ══════════════════════════════════════════════════════════
about:
  description: "I'm Julia (or Juju): an amateur photographer, designer, maker, and collector of moments, stories, and way too many hobbies."
  heading: "Hi, I'm Julia."
  paragraphs:
    - >
      I'm Julia (or "Juju"), an amateur photographer, designer, maker, and
      collector of moments, stories, and way too many hobbies. I'm
      endlessly fascinated by people, the places that shape us, and the
      beauty hiding in plain sight. This little space is where all my
      curiosities come together.
    - >
      Behind the camera, my real skill is people. I'm good at putting
      strangers at ease and bringing energy into a room, and some of it
      ends up in the photos. I photograph friends, and friends of friends.
      If that might be you, say hello.

  facts_heading: "A few things about me"
  # Add, remove or reorder facts freely: each is a label and a line.
  facts:
    - label: "Home"
      text: "Greenpoint, Brooklyn, by way of inland California"
    - label: "Italy so far"
      text: "18 of 20 regions · Friuli-Venezia Giulia and Basilicata next"
    - label: "Off camera"
      text: "Watercolor, jewelry, piano, and too many other hobbies"
    - label: "Day job"
      text: "Experience designer"

  archive_label: "Where this started"
  archive_text: >
    Before this site there was Il Bel Viaggio, a little photo blog I kept
    from 2015 to 2016. It's still there, just as it was.
  archive_link: "Visit the archive: Il Bel Viaggio →"


# ═══ INQUIRE ════════════════════════════════════════════════════════
inquire:
  description: "Ask Julia about a photo shoot, an available pair of earrings, or a commission."
  heading: "Say hello"
  intro: >
    Planning a shoot, eyeing a pair of earrings, or dreaming up a
    commission? Start here. Proper forms are coming soon; for now, email
    works best.
  instagram_line: "Or find me on Instagram:"

  # The inquiry blocks (on this page, the gallery pages and the studio).
  # The questions also pre-fill the email when someone clicks "Email me".
  shoot:
    label: "Ask about a shoot"
    heading: "Tell me who'll be there, and what you want to remember."
    email_subject: "Photo shoot inquiry"
    questions:
      - "What kind of shoot (wedding or engagement, family or newborn, portraits or headshots, a community event…)?"
      - "Who will be there?"
      - "What should these photos feel like?"
      - "Anyone camera-shy? Most people are."
      - "Roughly when, and where?"
  jewelry:
    label: "Pieces & commissions"
    heading: "Tell me who it’s for, and I’ll tell you what I see."
    email_subject: "Jewelry inquiry"
    questions:
      - "A piece you saw in the studio, or a commission?"
      - "Who is it for, and what is the occasion?"
      - "Colors, shapes or stories you love:"
      - "When do you need it by?"
  intro_to_questions: "A few things I'll ask:"
  email_button: "Email me"
  email_greeting: "Hi Julia,"
  email_name_prompt: "Your name:"


